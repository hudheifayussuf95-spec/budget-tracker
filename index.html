
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Budget Tracker</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Header -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>

        <!-- Add Expense Section -->
        <section class="expense-form">
            <h2>Add Expense</h2>

            <div class="input-group">
                <label for="expense-name">Expense Name:</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="Enter expense name"
                >
            </div>

            <div class="input-group">
                <label for="expense-amount">Amount (KES):</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="Enter amount"
                >
            </div>

            <div class="input-group">
                <label for="expense-category">Category:</label>
                <select id="expense-category">
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="button">Add Expense</button>
        </section>

        <!-- Your Expenses Section -->
        <section id="expenses-list">
            <h2>Your Expenses</h2>

            <p class="empty-message">No expenses yet.</p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Budget Tracker. All rights reserved.</p>
    </footer>

</body>
</html>
